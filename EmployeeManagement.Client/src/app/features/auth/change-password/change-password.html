
<div class="change-password-page">
  <div class="password-card">
    @if (isAdmin) {
    <a routerLink="/employees" class="back-link">
      &larr; Back to Employees
    </a>
    } @else {
    <a routerLink="/leave" class="back-link">
      &larr; Back to Dashboard
    </a>
    }
    <div class="page-heading">
      <div class="heading-icon">🔐</div>
      <h2>Change Password</h2>
      <p>Update your password to keep your account secure.</p>
    </div>

    <div *ngIf="errorMessage"
         class="alert alert-error"
         role="alert">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage"
         class="alert alert-success"
         role="status">
      {{ successMessage }}
    </div>

    <form (ngSubmit)="changePassword()" #passwordForm="ngForm">
      <div class="form-group">
        <label for="currentPassword">Current Password</label>

        <div class="password-input">
          <input id="currentPassword"
                 name="currentPassword"
                 [type]="showCurrentPassword ? 'text' : 'password'"
                 [(ngModel)]="currentPassword"
                 autocomplete="current-password"
                 required
                 placeholder="Enter current password" />

          <button type="button"
                  class="toggle-password"
                  (click)="showCurrentPassword = !showCurrentPassword"
                  [attr.aria-label]="showCurrentPassword ? 'Hide current password' : 'Show current password'">
            {{ showCurrentPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="newPassword">New Password</label>

        <div class="password-input">
          <input id="newPassword"
                 name="newPassword"
                 [type]="showNewPassword ? 'text' : 'password'"
                 [(ngModel)]="newPassword"
                 autocomplete="new-password"
                 minlength="8"
                 maxlength="100"
                 required
                 placeholder="Enter new password" />

          <button type="button"
                  class="toggle-password"
                  (click)="showNewPassword = !showNewPassword"
                  [attr.aria-label]="showNewPassword ? 'Hide new password' : 'Show new password'">
            {{ showNewPassword ? 'Hide' : 'Show' }}
          </button>
        </div>

        <small>Use at least 8 characters.</small>
      </div>

      <div class="form-group">
        <label for="confirmNewPassword">Confirm New Password</label>

        <div class="password-input">
          <input id="confirmNewPassword"
                 name="confirmNewPassword"
                 [type]="showConfirmPassword ? 'text' : 'password'"
                 [(ngModel)]="confirmNewPassword"
                 autocomplete="new-password"
                 required
                 placeholder="Re-enter new password" />

          <button type="button"
                  class="toggle-password"
                  (click)="showConfirmPassword = !showConfirmPassword"
                  [attr.aria-label]="showConfirmPassword ? 'Hide confirmation' : 'Show confirmation'">
            {{ showConfirmPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>

      <button type="submit"
              class="btn-submit"
              [disabled]="isSubmitting">
        {{ isSubmitting ? 'Updating...' : 'Change Password' }}
      </button>
    </form>
  </div>
</div>
